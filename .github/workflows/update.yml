name: Liste aktualisieren

on:
  schedule:
    - cron: "13 19 * * *"   # täglich 19:13 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install reportlab
      - name: Bauen
        run: python build.py
      - name: Commit und Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .changed ]; then
            DATE=$(cat .changed)
            rm .changed
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Aktualisierung $DATE"
            git push
            TAG="v$DATE-$(date +%H%M)"
            # Release-Info = neuester CHANGELOG-Abschnitt (was neu ist)
            awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
            gh release create "$TAG" PS5-ZSTD-LZ4-Kompatibilitaetsliste.pdf               --title "Stand $DATE" --notes-file notes.md
          else
            echo "Keine Änderungen"
          fi
