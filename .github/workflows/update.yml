name: Update list

on:
  schedule:
    - cron: "13 19 * * *"   # daily 19:13 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install reportlab pillow
      - name: Build
        run: python build.py
      - name: Commit and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .changed ]; then
            DATE=$(cat .changed)
            rm .changed
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Update $DATE"
            git push
            TAG="v$DATE-$(date +%H%M)"
            # Release notes = newest CHANGELOG section, English first, then German
            { awk '/^## /{n++} n==1' CHANGELOG.md; echo; echo '---'; echo; awk '/^## /{n++} n==1' CHANGELOG.de.md; } > notes.md
            gh release create "$TAG" PS5-ZSTD-LZ4-Kompatibilitaetsliste.pdf PS5-ZSTD-LZ4-Compatibility-List.pdf               --title "Status $DATE" --notes-file notes.md
          else
            echo "No changes"
          fi
